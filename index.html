<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1976d2">
<title>ÁGUA+</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5faff;
  color: #173f70;
}

header {
  text-align: center;
  padding: 28px 10px 18px;
  font-size: 32px;
  font-weight: bold;
}

header span {
  font-size: 45px;
}

.container {
  width: 92%;
  max-width: 500px;
  margin: auto;
}

.card {
  background: white;
  border-radius: 28px;
  padding: 28px 20px;
  margin-bottom: 22px;
  text-align: center;
  box-shadow: 0 5px 20px rgba(20,80,130,.10);
}

h2 {
  margin-top: 0;
  font-size: 25px;
}

.garrafas {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 25px 0;
  flex-wrap: wrap;
}

.garrafa {
  font-size: 42px;
  opacity: .20;
  transition: .2s;
}

.garrafa.cheia {
  opacity: 1;
}

.contador {
  font-size: 54px;
  font-weight: bold;
  margin: 10px 0;
}

.faltam {
  font-size: 21px;
  margin-bottom: 18px;
}

.info {
  font-size: 19px;
  margin: 12px 0;
}

button {
  width: 100%;
  border: none;
  border-radius: 18px;
  padding: 18px;
  font-size: 21px;
  font-weight: bold;
  color: white;
  background: #1976d2;
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}

button:disabled {
  background: #7bb0df;
}

.recompensa {
  font-size: 22px;
  margin: 12px;
}
