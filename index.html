<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ÁGUA+</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f9ff;
    color: #173f70;
}

header {
    text-align: center;
    padding: 35px 10px 25px;
}

.logo {
    font-size: 42px;
    font-weight: bold;
}

.container {
    padding: 0 20px 40px;
}

.card {
    background: white;
    border-radius: 30px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

h1 {
    font-size: 32px;
    margin: 0 0 30px;
}

.gotas {
    font-size: 42px;
    letter-spacing: 5px;
    margin-bottom: 25px;
}

.contador {
    font-size: 60px;
    font-weight: bold;
    margin: 10px 0;
}

.faltam {
    font-size: 23px;
    margin-bottom: 25px;
}

.creditos {
    font-size: 20px;
    margin-bottom: 25px;
}

button {
    width: 100%;
    border: none;
    border-radius: 20px;
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
    color: white;
    background: #1976d2;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

.info {
    margin-top: 25px;
    background: white;
    border-radius: 30px;
    padding: 25px;
    text-align: center;
    font-size: 20px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.06);
}

</style>
</head>

<body>

<header>
    <div class="logo">💧 ÁGUA+</div>
</header>

<div class="container">

    <div class="card">

        <h1>META DE HOJE</h1>

        <div class="gotas">
            💧 💧 💧 💧 💧 💧
        </div>

        <div class="contador">
            0 / 6
        </div>

        <div class="faltam">
            Faltam 6 garrafas
        </div>

        <div class="creditos">
            🪙 Créditos hoje: 0
        </div>

        <button>
            💧 BEBI ÁGUA
        </button>

    </div>

    <div class="info">
        🔥 Sequência: 0 dias
        <br><br>
        🪙 Carteira: 0 créditos
    </div>

</div>

</body>
</html>
